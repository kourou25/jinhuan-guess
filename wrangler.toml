name = "guess-standalone-local"
main = ".build/standalone-worker.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "guess-standalone-local"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "guess-standalone-local-media"

[vars]
STANDALONE_LOCAL = "1"
BLOCK_COUNTRIES = "none"
REGISTER_MODE = "closed"
